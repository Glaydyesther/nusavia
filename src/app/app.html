<div class="app-shell">
  <app-mainoptions
    [activeOption]="selectedOption()"
    (optionSelected)="selectOption($event)"
  />

  <main class="main-area">
    <header class="topbar">
      <div class="topbar-spacer"></div>
      <button class="icon-button notification-button" type="button" aria-label="Notificaciones">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
        </svg>
        <span class="notification-dot"></span>
      </button>
      <span class="topbar-divider"></span>
      <button class="profile-button" type="button" aria-label="Perfil de la doctora Ana">
        <img src="https://i.pravatar.cc/96?img=47" alt="" />
        <span>Dra. Ana</span>
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="m5 7 5 5 5-5" />
        </svg>
      </button>
    </header>

    <section class="page-content" aria-live="polite">
      @if (selectedOption() === 'Pacientes') {
        <app-pacients />
      } @else {
        <div class="section-placeholder">
          <span class="placeholder-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z" />
            </svg>
          </span>
          <h1>{{ selectedOption() }}</h1>
          <p>Esta sección estará disponible próximamente.</p>
        </div>
      }
    </section>
  </main>
</div>
